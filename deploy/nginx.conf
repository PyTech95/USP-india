# nginx site for the USP India website. Copy to /etc/nginx/sites-available/uspindia,
# link it into sites-enabled, then run: sudo certbot --nginx -d uspindia.org -d www.uspindia.org
server {
    listen 80;
    server_name uspindia.org www.uspindia.org;

    client_max_body_size 25m;   # photo uploads (the app allows up to 20 MB)

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built JS/CSS files have hashed names, so they can be cached for a long time.
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
