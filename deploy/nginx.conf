# nginx site for the USP India website: /etc/nginx/sites-available/uspindia (linked into sites-enabled).
#
# Every address opens the site and ends on the one main address, https://www.uspindia.org (the address the
# site gives search engines — SITE_URL in backend/.env and frontend/src/lib/site.js):
#   http://uspindia.org, http://www.uspindia.org, https://uspindia.org  →  https://www.uspindia.org
#
# Needs one certificate for both names (once):  sudo certbot certonly --nginx -d uspindia.org -d www.uspindia.org
# If `sudo certbot certificates` shows a different certificate name than "uspindia.org", change the four
# /etc/letsencrypt/live/uspindia.org/ paths below to that name. Then: sudo nginx -t && sudo systemctl reload nginx

# http:// (both names) → https://www  (certificate renewals still work over http)
server {
    listen 80;
    listen [::]:80;
    server_name uspindia.org www.uspindia.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.uspindia.org$request_uri; }
}

# https://uspindia.org → https://www.uspindia.org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uspindia.org;

    ssl_certificate /etc/letsencrypt/live/uspindia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uspindia.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.uspindia.org$request_uri;
}

# the site: https://www.uspindia.org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.uspindia.org;

    ssl_certificate /etc/letsencrypt/live/uspindia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uspindia.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;   # photo uploads (the app allows up to 20 MB)

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # one trusted value (used for spam limits and visitor counts)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built JS/CSS files have hashed names; the site sends them compressed and cacheable for a year.
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }
}
